<!doctype html>

  <style type="text/tailwindcss">
    @theme {
        /* Light theme */
        --color-background: #ffffff;
        --color-surface: #f0f0f0;
        --color-border: #e0e0e0;
        --color-muted: #666666;
        --color-hover: #e0e0e0;
        --color-accent: #4a90e2;
        --color-foreground: #333333;
      }
      .filter-chip {
        @apply rounded-md px-3 py-1 text-sm font-medium text-muted transition-colors;
      }
      .filter-chip:hover {
        @apply text-foreground;

      .filter-chip.is-active {
